<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Malawi National Coat of Arms (Ministry of Health) -->
  <defs>
    <linearGradient id="mwiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="mwiRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Fish Eagle and Rising Sun Crest at Top -->
  <!-- Rising Sun rays behind crest -->
  <path d="M 80,35 L 75,18 L 88,30 L 100,12 L 112,30 L 125,18 L 120,35 Z" fill="#facc15" stroke="#ca8a04" stroke-width="0.7" />
  <!-- African Fish Eagle on Water Crest -->
  <g fill="#f8fafc" stroke="#0f172a" stroke-width="0.8">
    <ellipse cx="100" cy="36" rx="9" ry="6" fill="#f8fafc" />
    <!-- Golden Beak -->
    <polygon points="100,32 97,37 103,37" fill="#f59e0b" />
    <!-- Eagle Wings spread -->
    <path d="M 92,36 C 80,28 72,35 68,44 C 78,42 88,40 94,40 Z" fill="#92400e" />
    <path d="M 108,36 C 120,28 128,35 132,44 C 122,42 112,40 106,40 Z" fill="#92400e" />
  </g>

  <!-- Central Escutcheon / Shield -->
  <g stroke="#0f172a" stroke-width="1.2">
    <!-- Top section: Blue and White Waves (Lake Malawi) -->
    <path d="M 72,55 Q 100,52 128,55 L 128,78 L 72,78 Z" fill="#0284c7" />
    <path d="M 72,62 Q 86,58 100,62 Q 114,66 128,62 M 72,70 Q 86,66 100,70 Q 114,74 128,70" fill="none" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Middle section: Red field with gold lion passant -->
    <rect x="72" y="78" width="56" height="28" fill="url(#mwiRed)" stroke="#0f172a" stroke-width="1.2" />
    <!-- Gold lion inside shield -->
    <path d="M 82,92 C 84,86 92,84 98,88 C 104,86 112,90 114,94 L 112,98 L 102,96 L 94,98 Z" fill="#fde047" stroke="#b45309" stroke-width="0.6" />

    <!-- Bottom section: Black base with golden rising sun -->
    <path d="M 72,106 L 128,106 C 128,135 100,150 100,150 C 100,150 72,135 72,106 Z" fill="#0f172a" stroke="#0f172a" stroke-width="1.2" />
    <circle cx="100" cy="148" r="18" fill="#facc15" stroke="#b45309" stroke-width="0.8" />
  </g>

  <!-- Left Supporter: Lion Rampant -->
  <g fill="url(#mwiGold)" stroke="#854d0e" stroke-width="0.8">
    <path d="M 45,70 C 45,62 55,62 58,68 C 65,80 68,110 70,125 C 62,126 50,132 45,142 C 40,130 45,95 45,70 Z" />
    <!-- Lion Head & Mane -->
    <circle cx="54" cy="66" r="8" fill="#ca8a04" />
    <circle cx="50" cy="65" r="5" fill="#fef08a" />
  </g>

  <!-- Right Supporter: Leopard Rampant with spots -->
  <g fill="url(#mwiGold)" stroke="#854d0e" stroke-width="0.8">
    <path d="M 155,70 C 155,62 145,62 142,68 C 135,80 132,110 130,125 C 138,126 150,132 155,142 C 160,130 155,95 155,70 Z" />
    <!-- Leopard Head -->
    <circle cx="146" cy="66" r="7" fill="#fef08a" />
    <!-- Spots on leopard -->
    <circle cx="148" cy="85" r="1.5" fill="#0f172a" />
    <circle cx="142" cy="100" r="1.5" fill="#0f172a" />
    <circle cx="146" cy="115" r="1.5" fill="#0f172a" />
  </g>

  <!-- Mountain Base (Mount Mulanje) -->
  <polygon points="30,152 70,140 100,146 130,140 170,152 160,165 40,165" fill="#65a30d" stroke="#365314" stroke-width="1" />

  <!-- National Motto Ribbon: "UNITY AND FREEDOM" -->
  <path d="M 30,168 Q 100,160 170,168 Q 160,186 100,182 Q 40,186 30,168 Z" fill="#007a3d" stroke="#ffd700" stroke-width="1.5" />
  <text x="100" y="177" fill="#ffffff" font-size="6.5" font-weight="900" font-family="'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="0.5">UNITY AND FREEDOM • MALAWI</text>
</svg>
