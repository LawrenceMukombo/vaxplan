<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Uganda National Coat of Arms (Ministry of Health) -->
  <defs>
    <linearGradient id="ugaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Crossed Ugandan Spears behind shield -->
  <g stroke="#64748b" stroke-width="2.5" stroke-linecap="round">
    <line x1="45" y1="35" x2="155" y2="165" />
    <line x1="155" y1="35" x2="45" y2="165" />
    <!-- Spearheads -->
    <polygon points="45,35 40,48 50,48" fill="#334155" />
    <polygon points="155,35 150,48 160,48" fill="#334155" />
  </g>

  <!-- Central Shield of Uganda -->
  <g stroke="#0f172a" stroke-width="1.2">
    <!-- Top 1/3: Lake Victoria Blue & White Waves -->
    <path d="M 75,45 Q 100,40 125,45 L 125,72 L 75,72 Z" fill="#0284c7" />
    <path d="M 75,54 Q 100,50 125,54 M 75,63 Q 100,59 125,63" stroke="#ffffff" stroke-width="2" fill="none" />

    <!-- Middle 1/3: Black field with Golden Sun -->
    <rect x="75" y="72" width="50" height="32" fill="#0f172a" stroke="#0f172a" stroke-width="1.2" />
    <!-- Golden Sun with rays -->
    <circle cx="100" cy="88" r="8" fill="#fde047" stroke="#ca8a04" stroke-width="0.8" />
    <path d="M 100,75 L 100,78 M 100,98 L 100,101 M 87,88 L 90,88 M 110,88 L 113,88" stroke="#fde047" stroke-width="1.5" />

    <!-- Bottom 1/3: Red field with Traditional Ugandan Long Drum -->
    <path d="M 75,104 L 125,104 C 125,135 100,152 100,152 C 100,152 75,135 75,104 Z" fill="#dc2626" stroke="#0f172a" stroke-width="1.2" />
    <!-- Golden Royal Drum -->
    <path d="M 92,112 Q 100,110 108,112 L 106,132 Q 100,135 94,132 Z" fill="#fde047" stroke="#854d0e" stroke-width="0.8" />
  </g>

  <!-- Left Supporter: Uganda Kob (Antelope) -->
  <g fill="#ca8a04" stroke="#78350f" stroke-width="0.8">
    <path d="M 42,75 C 42,65 52,65 56,72 C 60,85 62,115 64,130 C 56,132 46,136 40,146 C 36,134 40,100 42,75 Z" />
    <!-- Kob Head & Horns -->
    <circle cx="50" cy="70" r="7" fill="#eab308" />
    <!-- Curved Horns -->
    <path d="M 52,65 Q 56,50 62,48 M 48,65 Q 50,52 54,48" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Right Supporter: Crested Crane (National Bird) -->
  <g fill="#e2e8f0" stroke="#0f172a" stroke-width="0.8">
    <path d="M 158,75 C 158,65 148,65 144,72 C 140,85 138,115 136,130 C 144,132 154,136 160,146 C 164,134 160,100 158,75 Z" fill="#334155" />
    <!-- Crane Head with Golden Crest and Red Wattle -->
    <circle cx="150" cy="68" r="6" fill="#f8fafc" />
    <!-- Red patch & wattle -->
    <circle cx="152" cy="70" r="2" fill="#ef4444" />
    <!-- Golden crown feathers -->
    <path d="M 148,64 L 145,52 M 150,63 L 150,50 M 152,64 L 155,52" stroke="#facc15" stroke-width="1.5" stroke-linecap="round" />
    <polygon points="144,68 138,70 144,72" fill="#64748b" />
  </g>

  <!-- River Nile and Green Compartment Base with Coffee & Cotton -->
  <polygon points="25,152 70,142 100,146 130,142 175,152 165,166 35,166" fill="#15803d" stroke="#14532d" stroke-width="1" />

  <!-- National Motto Ribbon: "FOR GOD AND MY COUNTRY" -->
  <path d="M 25,168 Q 100,160 175,168 Q 165,186 100,182 Q 35,186 25,168 Z" fill="#0f172a" stroke="#ffd700" stroke-width="1.5" />
  <text x="100" y="177" fill="#ffffff" font-size="6" font-weight="900" font-family="'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="0.5">FOR GOD AND MY COUNTRY • UGANDA</text>
</svg>
