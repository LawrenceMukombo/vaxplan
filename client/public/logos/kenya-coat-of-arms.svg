<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Kenya National Coat of Arms (Ministry of Health) -->
  <defs>
    <linearGradient id="kenGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Crossed Maasai Spears behind shield -->
  <g stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round">
    <line x1="45" y1="35" x2="155" y2="165" />
    <line x1="155" y1="35" x2="45" y2="165" />
    <!-- Spearheads -->
    <polygon points="45,35 40,48 50,48" fill="#475569" />
    <polygon points="155,35 150,48 160,48" fill="#475569" />
  </g>

  <!-- Traditional Maasai Shield in Center -->
  <g stroke="#0f172a" stroke-width="1.2">
    <!-- Shield contour -->
    <path d="M 82,45 Q 100,38 118,45 C 126,80 126,120 100,150 C 74,120 74,80 82,45 Z" fill="#b91c1c" />
    <!-- Black and White traditional patterns -->
    <path d="M 85,55 Q 100,50 115,55 L 115,70 Q 100,65 85,70 Z" fill="#0f172a" />
    <path d="M 83,125 Q 100,140 117,125 L 115,138 Q 100,148 85,138 Z" fill="#0f172a" />
    <!-- White dividing lines -->
    <line x1="100" y1="42" x2="100" y2="148" stroke="#ffffff" stroke-width="2" />
    <!-- Cockerel holding axe (Kenyatta National Emblem) -->
    <circle cx="100" cy="95" r="7" fill="#ffffff" />
    <path d="M 97,93 C 97,90 103,90 103,93 C 103,98 97,98 97,93 Z" fill="#dc2626" />
    <polygon points="104,93 108,91 106,95" fill="#facc15" />
    <!-- Axe in cockerel's hand -->
    <line x1="104" y1="95" x2="110" y2="102" stroke="#713f12" stroke-width="1.2" />
    <polygon points="110,102 114,100 112,104" fill="#64748b" />
  </g>

  <!-- Left Supporter: Lion Rampant holding spear -->
  <g fill="url(#kenGold)" stroke="#854d0e" stroke-width="0.8">
    <path d="M 40,75 C 40,65 52,65 56,72 C 62,85 64,115 66,130 C 58,131 46,136 40,146 C 36,134 40,100 40,75 Z" />
    <!-- Lion Head & Mane -->
    <circle cx="50" cy="70" r="9" fill="#ca8a04" />
    <circle cx="47" cy="69" r="6" fill="#fef08a" />
    <!-- Forepaws clasping spear -->
    <ellipse cx="65" cy="85" rx="4" ry="2.5" fill="#fde047" />
  </g>

  <!-- Right Supporter: Lion Rampant holding spear -->
  <g fill="url(#kenGold)" stroke="#854d0e" stroke-width="0.8">
    <path d="M 160,75 C 160,65 148,65 144,72 C 138,85 136,115 134,130 C 142,131 154,136 160,146 C 164,134 160,100 160,75 Z" />
    <!-- Lion Head & Mane -->
    <circle cx="150" cy="70" r="9" fill="#ca8a04" />
    <circle cx="153" cy="69" r="6" fill="#fef08a" />
    <!-- Forepaws clasping spear -->
    <ellipse cx="135" cy="85" rx="4" ry="2.5" fill="#fde047" />
  </g>

  <!-- Mount Kenya Compartment Base with Coffee/Tea Agriculture -->
  <polygon points="25,152 70,142 100,146 130,142 175,152 165,166 35,166" fill="#15803d" stroke="#14532d" stroke-width="1" />

  <!-- National Motto Ribbon: "HARAMBEE" (Let us pull together) -->
  <path d="M 30,168 Q 100,160 170,168 Q 160,186 100,182 Q 40,186 30,168 Z" fill="#b91c1c" stroke="#ffd700" stroke-width="1.5" />
  <text x="100" y="177" fill="#ffffff" font-size="7" font-weight="900" font-family="'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="0.8">HARAMBEE • KENYA</text>
</svg>
