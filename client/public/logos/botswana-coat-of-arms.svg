<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Botswana National Coat of Arms (Ministry of Health) -->
  <defs>
    <linearGradient id="bwaBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Traditional Oval East African Shield in Center -->
  <g stroke="#0f172a" stroke-width="1.2">
    <!-- Shield contour -->
    <path d="M 72,50 Q 100,42 128,50 C 138,80 138,120 100,152 C 62,120 62,80 72,50 Z" fill="#ffffff" />

    <!-- Top: Three Cogwheels (Industry) -->
    <g fill="#94a3b8" stroke="#334155" stroke-width="0.8">
      <circle cx="86" cy="65" r="7" />
      <circle cx="114" cy="65" r="7" />
      <circle cx="100" cy="76" r="7" fill="#64748b" />
    </g>

    <!-- Middle: Blue and White Waves (Rain / Water / Pula) -->
    <path d="M 68,90 Q 100,85 132,90 L 134,106 Q 100,100 66,106 Z" fill="url(#bwaBlue)" stroke="#0f172a" stroke-width="1" />
    <path d="M 68,96 Q 100,91 132,96 M 67,101 Q 100,96 133,101" stroke="#ffffff" stroke-width="1.8" fill="none" />

    <!-- Bottom: Bull's Head (Livestock Wealth) -->
    <g fill="#78350f" stroke="#451a03" stroke-width="0.8">
      <!-- Head shape -->
      <polygon points="100,140 92,120 108,120" />
      <!-- Bull Horns -->
      <path d="M 92,120 Q 82,112 84,106 M 108,120 Q 118,112 116,106" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Left Supporter: Zebra holding Elephant Tusk -->
  <g stroke="#0f172a" stroke-width="0.8">
    <path d="M 45,75 C 45,65 55,65 58,72 C 64,85 64,115 66,130 C 58,131 46,136 42,146 C 38,134 42,100 45,75 Z" fill="#ffffff" />
    <!-- Zebra Stripes -->
    <path d="M 44,82 L 56,86 M 43,94 L 58,98 M 43,106 L 60,110 M 44,118 L 62,122" stroke="#0f172a" stroke-width="2" />
    <circle cx="52" cy="70" r="7" fill="#ffffff" />
    <circle cx="50" cy="70" r="2" fill="#0f172a" />
    <!-- Elephant Tusk held on Left -->
    <path d="M 38,150 C 35,115 42,85 52,65" fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 38,150 C 35,115 42,85 52,65" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Right Supporter: Zebra holding Sorghum Stalk -->
  <g stroke="#0f172a" stroke-width="0.8">
    <path d="M 155,75 C 155,65 145,65 142,72 C 136,85 136,115 134,130 C 142,131 154,136 158,146 C 162,134 158,100 155,75 Z" fill="#ffffff" />
    <!-- Zebra Stripes -->
    <path d="M 156,82 L 144,86 M 157,94 L 142,98 M 157,106 L 140,110 M 156,118 L 138,122" stroke="#0f172a" stroke-width="2" />
    <circle cx="148" cy="70" r="7" fill="#ffffff" />
    <circle cx="150" cy="70" r="2" fill="#0f172a" />
    <!-- Sorghum Stalk (Mabele) held on Right -->
    <path d="M 162,150 C 165,115 158,85 148,65" fill="none" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round" />
    <!-- Sorghum head grains -->
    <circle cx="148" cy="65" r="3.5" fill="#eab308" stroke="#a16207" stroke-width="0.8" />
  </g>

  <!-- National Motto Ribbon: "PULA" (Rain / Blessings) -->
  <path d="M 35,168 Q 100,160 165,168 Q 155,186 100,182 Q 45,186 35,168 Z" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
  <text x="100" y="177" fill="#ffffff" font-size="7.5" font-weight="900" font-family="'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="1">PULA • BOTSWANA</text>
</svg>
