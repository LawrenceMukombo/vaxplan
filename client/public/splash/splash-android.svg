<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradAndroid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <radialGradient id="glowGlowAndroid" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldGlowAndroid" cx="50%" cy="42%" r="30%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Icon Gradients -->
    <linearGradient id="shieldGradAndroid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="accentGradAndroid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="barGradAndroid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowFilterAndroid" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#3B82F6" flood-opacity="0.35" />
    </filter>

    <filter id="textGlowAndroid" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1080" height="1920" fill="url(#bgGradAndroid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="540" cy="800" r="500" fill="url(#glowGlowAndroid)" />
  <circle cx="540" cy="780" r="280" fill="url(#emeraldGlowAndroid)" />

  <!-- Central Brand Container -->
  <g transform="translate(540, 750)" filter="url(#shadowFilterAndroid)">
    <!-- Outer Ring Orbit -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#accentGradAndroid)" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.45" />

    <!-- Shield Background Glass Backing -->
    <path d="M 0,-115 L 85,-60 L 85,40 Q 85,115 0,140 Q -85,115 -85,40 L -85,-60 Z" fill="#0F172A" opacity="0.9" stroke="url(#accentGradAndroid)" stroke-width="3.5" />

    <!-- Core Brand Icon: Geometric Health Shield & Cross -->
    <path d="M 0,-95 L 68,-48 L 68,34 Q 68,95 0,115 Q -68,95 -68,34 L -68,-48 Z" fill="url(#shieldGradAndroid)" />

    <!-- Cross / Syringe Nexus Emblem -->
    <g fill="#FFFFFF">
      <!-- Vertical Bar -->
      <rect x="-14" y="-56" width="28" height="112" rx="8" />
      <!-- Horizontal Bar -->
      <rect x="-56" y="-14" width="112" height="28" rx="8" />
      <!-- Center Emerald Diamond Core -->
      <polygon points="0,-22 22,0 0,22 -22,0" fill="#10B981" />
    </g>

    <!-- Orbiting Data Nodes -->
    <circle cx="100" cy="-45" r="6" fill="#38BDF8" />
    <circle cx="-100" cy="-45" r="6" fill="#38BDF8" />
    <circle cx="115" cy="28" r="5" fill="#10B981" />
    <circle cx="-115" cy="28" r="5" fill="#10B981" />
  </g>

  <!-- Platform Typography -->
  <text x="540" y="1010" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#F8FAFC" letter-spacing="4" filter="url(#textGlowAndroid)">
    Vax<tspan fill="#38BDF8">Plan</tspan>
  </text>

  <text x="540" y="1065" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#94A3B8" letter-spacing="1.5">
    Digital Immunization Microplanning
  </text>

  <!-- Standards & Architecture Badges -->
  <g transform="translate(540, 1150)">
    <!-- WHO RED / Gavi Badge -->
    <g transform="translate(0, 0)">
      <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="-110" cy="0" r="5" fill="#38BDF8" />
      <text x="-90" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">WHO RED · Gavi HSS</text>
    </g>

    <!-- Offline-First PostGIS Badge -->
    <g transform="translate(0, 55)">
      <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="-110" cy="0" r="5" fill="#10B981" />
      <text x="-90" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Offline-First · Spatial GIS</text>
    </g>
  </g>

  <!-- Modern Loading Progress Bar -->
  <g transform="translate(540, 1420)">
    <!-- Track -->
    <rect x="-220" y="-4" width="440" height="8" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.5" />
    <!-- Animated Glow Fill -->
    <rect x="-220" y="-4" width="280" height="8" rx="4" fill="url(#barGradAndroid)">
      <animate attributeName="width" values="60;440;180;440" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>

  <text x="540" y="1475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#64748B" letter-spacing="0.5">
    Syncing offline operational cache...
  </text>

  <!-- Version and Footprint -->
  <text x="540" y="1820" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#475569">
    Version 1.9.4 · Health Facility &amp; Field Edition
  </text>
</svg>
