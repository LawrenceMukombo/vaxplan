<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <radialGradient id="glowGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="50%" cy="45%" r="25%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Icon Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3B82F6" flood-opacity="0.3" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="960" cy="460" r="600" fill="url(#glowGlow)" />
  <circle cx="960" cy="440" r="350" fill="url(#emeraldGlow)" />

  <!-- Subtle Decorative Grid Elements -->
  <g opacity="0.05" stroke="#94A3B8" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="1080" />
    <line x1="360" y1="0" x2="360" y2="1080" />
    <line x1="1560" y1="0" x2="1560" y2="1080" />
    <line x1="1760" y1="0" x2="1760" y2="1080" />
    <line x1="0" y1="200" x2="1920" y2="200" />
    <line x1="0" y1="880" x2="1920" y2="880" />
  </g>

  <!-- Central Brand Container -->
  <g transform="translate(960, 430)" filter="url(#shadowFilter)">
    <!-- Outer Shield Halo Ring -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
    
    <!-- Shield Background Glass Backing -->
    <path d="M 0,-85 L 65,-45 L 65,30 Q 65,85 0,105 Q -65,85 -65,30 L -65,-45 Z" fill="#0F172A" opacity="0.85" stroke="url(#accentGrad)" stroke-width="3" />

    <!-- Core Brand Icon: Geometric Health Shield & Cross -->
    <path d="M 0,-70 L 50,-35 L 50,25 Q 50,70 0,85 Q -50,70 -50,25 L -50,-35 Z" fill="url(#shieldGrad)" />

    <!-- Cross / Syringe Nexus Emblem -->
    <g fill="#FFFFFF">
      <!-- Vertical Bar of Cross -->
      <rect x="-10" y="-42" width="20" height="84" rx="6" />
      <!-- Horizontal Bar of Cross -->
      <rect x="-42" y="-10" width="84" height="20" rx="6" />
      <!-- Center Emerald Diamond Core -->
      <polygon points="0,-16 16,0 0,16 -16,0" fill="#10B981" />
    </g>

    <!-- Orbiting Data Nodes -->
    <circle cx="75" cy="-35" r="4.5" fill="#38BDF8" />
    <circle cx="-75" cy="-35" r="4.5" fill="#38BDF8" />
    <circle cx="85" cy="20" r="3.5" fill="#10B981" />
    <circle cx="-85" cy="20" r="3.5" fill="#10B981" />
  </g>

  <!-- Platform Typography -->
  <text x="960" y="630" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#F8FAFC" letter-spacing="3" filter="url(#textGlow)">
    Vax<tspan fill="#38BDF8">Plan</tspan>
  </text>

  <text x="960" y="675" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94A3B8" letter-spacing="1.5">
    Digital Immunization Microplanning Platform
  </text>

  <!-- Standards & Architecture Badges -->
  <g transform="translate(960, 725)">
    <!-- WHO RED / Gavi Badge -->
    <g transform="translate(-180, 0)">
      <rect x="-100" y="-15" width="200" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="-80" cy="0" r="4" fill="#38BDF8" />
      <text x="-65" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">WHO RED · Gavi HSS</text>
    </g>

    <!-- Offline-First PostGIS Badge -->
    <g transform="translate(180, 0)">
      <rect x="-100" y="-15" width="200" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="-80" cy="0" r="4" fill="#10B981" />
      <text x="-65" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Offline-First · GIS Spatial</text>
    </g>
  </g>

  <!-- Modern Loading Progress Bar -->
  <g transform="translate(960, 830)">
    <!-- Track -->
    <rect x="-240" y="-3" width="480" height="6" rx="3" fill="#1E293B" stroke="#334155" stroke-width="0.5" />
    <!-- Animated Glow Fill -->
    <rect x="-240" y="-3" width="340" height="6" rx="3" fill="url(#barGrad)">
      <animate attributeName="width" values="80;480;200;480" dur="3.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <text x="960" y="875" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748B" letter-spacing="0.8">
    Initializing local database and geospatial workspace...
  </text>

  <!-- Version and Footprint -->
  <text x="960" y="1030" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
    Version 1.9.4 · Secure Enterprise Edition · Multi-Country Ready
  </text>
</svg>
